// 掌机键位：与 quake.gptk 一一对应
// 关掉引擎自己的手柄读取，避免和 gptokeyb 的键鼠事件重复
joy_enable 0
+mlook
sensitivity 4

// 移动（左摇杆）
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"

// 动作
bind "SPACE" "+jump"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+jump"
bind "CTRL" "+movedown"
bind "ALT" "+strafe"
bind "v" "+melee"
bind "z" "centerview"

// 切枪：X/十字键上=下一把，L1/十字键下=上一把
bind "q" "impulse 10"
bind "r" "impulse 12"

// 菜单 / 计分板
bind "TAB" "+showscores"
bind "ESCAPE" "togglemenu"

// 快速存读
bind "f6" "save quick"
bind "f9" "load quick"
